name: Coletar preços

on:
  schedule:
    - cron: "0 11 * * *"      # todo dia 08:00 (Brasília); o script só coleta a cada ~2 dias
  workflow_dispatch:           # botão "Run workflow" para rodar na hora

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Coletar preços
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python main.py

      - name: Salvar dados no repositório
        if: always()
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || (git commit -m "Atualiza preços" && git pull --rebase && git push)

      - name: Guardar capturas de depuração
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
